services:
  genai-service:
    build:
      context: ./service
      dockerfile: Dockerfile
    container_name: testrix-genai
    restart: unless-stopped
    # Groq/Tavily API keys live in service/.env (gitignored, never committed).
    env_file:
      - ./service/.env
    environment:
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:?PORTAL_JWT_SECRET must be set in .env}
    ports:
      - "3000:3000"
    networks:
      - testrix

networks:
  testrix:
    name: testrix_network
